name: Publish verified QingJi v1.0.17

on:
  push:
    paths:
      - '.release/trigger-v1.0.17-final'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch public test lab
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Sodola-Avalon/qingji-android-test-lab.git testlab

      - name: Reconstruct exact tested APK
        run: |
          set -euo pipefail
          cp testlab/QingJi-v1.0.15.apk QingJi-v1.0.15.apk
          cat testlab/.ci/v1.0.16/patch.b64.?? | tr -d '\r\n' | base64 -d > v1016.patch.zst
          zstd --patch-from=QingJi-v1.0.15.apk -d -f v1016.patch.zst -o QingJi-v1.0.16.apk
          echo '8e51e396345d5cc6a4d390bf519d7ba321eafe0c944b30ec9f671b40254ededa  QingJi-v1.0.16.apk' | sha256sum -c -
          python3 -c "from pathlib import Path; p=Path('testlab/.ci/v1.0.17/patch.b64.01'); s=p.read_text(); assert len(s)==12000 and s[7829]=='t'; p.write_text(s[:7829]+'T'+s[7830:])"
          echo '0aa0eb591f6795af3722429480c5700e7622dde8111c7130123d81fc5cd7fb87  testlab/.ci/v1.0.17/patch.b64.01' | sha256sum -c -
          cat testlab/.ci/v1.0.17/patch.b64.0[0-9] | base64 -d -i > v1017.patch.zst
          zstd --patch-from=QingJi-v1.0.16.apk -d -f v1017.patch.zst -o QingJi-v1.0.17.apk
          echo 'd03b0521acbc4fa7eaca1dfd988e22312c3018774646a98ad327367bf6d82310  QingJi-v1.0.17.apk' | sha256sum -c -
          printf '%s  %s\n' 'd03b0521acbc4fa7eaca1dfd988e22312c3018774646a98ad327367bf6d82310' 'QingJi-v1.0.17.apk' > QingJi-v1.0.17.apk.sha256

      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          ## 清记 V1.0.17

          本版本正式接入 GitHub 在线更新，并保留 V1.0.16 已验证的修复。

          ### 新增
          - 设置 → 关于清记 → 检查更新，正式接入 `Sodola-Avalon/QingJi-Releases`。
          - 默认仅在用户主动点击“检查更新”时联网，不增加后台轮询或常驻服务。
          - 支持读取最新正式 Release 的版本号、更新日志和 APK。
          - 下载更新时要求同版本 `.apk.sha256`，安装前校验 SHA-256。
          - 使用受限的内部 UpdateApkProvider 向 Android 系统安装器提供更新 APK。
          - 未授权“安装未知应用”时，引导到系统设置；返回清记后可继续待安装更新。

          ### 修复与确认
          - 保留 V1.0.16 的纵向翻页提示位置修复。
          - 保留每日重复任务删除/编辑弹窗及重复编辑双调用修复。
          - 保留提醒权限链、精确闹钟调度和进程被杀后的提醒恢复逻辑。

          ### 完整性
          APK SHA-256：`d03b0521acbc4fa7eaca1dfd988e22312c3018774646a98ad327367bf6d82310`
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.0.17 >/dev/null 2>&1; then
            echo 'v1.0.17 already exists; refusing to overwrite.'
            exit 1
          fi
          gh release create v1.0.17 \
            QingJi-v1.0.17.apk \
            QingJi-v1.0.17.apk.sha256 \
            --title '清记 V1.0.17' \
            --notes-file release-notes.md
