name: Publish verified QingJi v1.0.18

on:
  push:
    paths:
      - '.release/trigger-v1.0.18-final'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Confirm release preflight succeeded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh run view 31965478366 --json conclusion --jq .conclusion)" = success

      - name: Download exact preflight-approved APK
        uses: actions/download-artifact@v4
        with:
          name: qingji-v1.0.18-release-preflight
          run-id: 31965478366
          github-token: ${{ github.token }}
          path: approved

      - name: Verify exact approved APK identity
        run: |
          set -euo pipefail
          cp approved/QingJi-v1.0.18.apk QingJi-v1.0.18.apk
          echo '5090167f428390cc791c36b04ac837c82b7835c6d480dfb74a72bb61f1c60896  QingJi-v1.0.18.apk' | sha256sum -c -
          printf '%s  %s\n' '5090167f428390cc791c36b04ac837c82b7835c6d480dfb74a72bb61f1c60896' 'QingJi-v1.0.18.apk' > QingJi-v1.0.18.apk.sha256

      - name: Verify version and original QingJi signer again
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort | tail -1)"
          AAPT2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort | tail -1)"
          test -x "$APKSIGNER"; test -x "$AAPT2"
          "$APKSIGNER" verify --verbose --print-certs QingJi-v1.0.18.apk | tee apksigner-v1018-release.txt
          grep -q 'Verified using v2 scheme.*true' apksigner-v1018-release.txt
          grep -q 'Verified using v3 scheme.*true' apksigner-v1018-release.txt
          grep -q 'certificate SHA-256 digest: 09826dcef6717e502e1d09f498e9733fe5b6773f16c69a82bf7cea7ecf092e33' apksigner-v1018-release.txt
          "$AAPT2" dump badging QingJi-v1.0.18.apk | tee badging-v1018-release.txt
          grep -q "package: name='com.qinghao.qingji' versionCode='21' versionName='1.0.18'" badging-v1018-release.txt

      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          ## 清记 V1.0.18

          本版本集中修复纵向翻页在部分 HyperOS 真机上的顶部坐标错位 / 穿模问题，并调整桌面图标视觉比例。

          ### 修复
          - 纵向翻页提示改为“上一页 / 下一页”两个独立固定布局槽位，不再在手势过程中依赖 Header / FAB 的运行时坐标去重算 margin。
          - 提示位置改由布局与 Window Insets 决定；手势过程只改变透明度、位移和进度，降低不同系统布局时序造成的漂移。
          - 顶部材质层重新组织为“清晰任务内容退场 + 模糊内容接管”，并固定层级为：任务内容 < 翻页反馈 < 玻璃材质 < Header < FAB，减少任务卡穿入顶部控件后的清晰残影。
          - 保持下拉 = 上一天、上拉 = 下一天；横向翻页仍不显示文字提示。

          ### 图标
          - 仅将桌面图标中央蓝色前景缩小约 10%。
          - 白色底板 / 外轮廓尺寸保持不变。

          ### 兼容性
          - 保留 V1.0.17 的 GitHub 手动检查更新、SHA-256 下载校验和系统安装器更新链路。
          - 保留重复任务、提醒调度、Widget、长按排序与复制上一次任务等既有行为。

          ### 完整性
          APK SHA-256：`5090167f428390cc791c36b04ac837c82b7835c6d480dfb74a72bb61f1c60896`
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.0.18 >/dev/null 2>&1; then
            echo 'v1.0.18 already exists; refusing to overwrite.'
            exit 1
          fi
          gh release create v1.0.18 \
            QingJi-v1.0.18.apk \
            QingJi-v1.0.18.apk.sha256 \
            --title '清记 V1.0.18' \
            --notes-file release-notes.md
